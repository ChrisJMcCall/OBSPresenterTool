[project]
name = "obs-presenter-tool"
version = "0.1.0"
description = "A small utility application to help manage an OBS Source capture window while presenting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "obsws-python>=1.8.1",
    "pyobjc-framework-cocoa>=13.0",
    "pyside6>=6.12.0",
]

[project.scripts]
window-selector = "OBSPresenterTool.gui.app:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "OBSPresenterTool"
